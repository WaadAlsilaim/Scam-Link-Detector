<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linecheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1117;
    --panel: #131a22;
    --panel-border: #1f2b36;
    --ink: #e6edf3;
    --ink-dim: #7d8ea3;
    --safe: #34d399;
    --suspicious: #f0b429;
    --scam: #f0554a;
    --accent: #3ddc97;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(61,220,151,0.06), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(240,85,74,0.05), transparent 45%);
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 32px 24px 64px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom: 20px; margin-bottom: 28px;
    border-bottom: 1px solid var(--panel-border);
  }
  .brand{ display:flex; align-items:center; gap: 10px; }
  .brand-mark{
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #1f9d6b);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-weight:600; font-size: 13px; color: #06120c;
  }
  .brand-name{ font-family: var(--mono); font-size: 14px; letter-spacing: 0.04em; color: var(--ink); font-weight: 600; }
  .topbar-meta{ font-family: var(--mono); font-size: 11.5px; color: #4b5b6c; letter-spacing: .02em; }

  .intro{
    color: var(--ink-dim); font-size: 14px; line-height: 1.6;
    max-width: 60ch; margin: 0 0 24px;
  }

  .panel-label{
    font-family: var(--mono); font-size: 11.5px; color: #4b5b6c;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
  }

  .scanner{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .scanner::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient( to bottom, rgba(61,220,151,0.035) 0px, rgba(61,220,151,0.035) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  .input-row{ display:flex; gap: 10px; position: relative; z-index:1; }
  input[type="text"]{
    flex: 1;
    background: #0a0f14;
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    padding: 14px 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]::placeholder{ color: #46586b; }
  input[type="text"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61,220,151,0.12);
  }

  button{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 9px;
    padding: 0 22px;
    background: var(--accent);
    color: #06140d;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
    white-space: nowrap;
  }
  button:hover{ background: #52e7ac; }
  button:active{ transform: scale(0.97); }
  button:disabled{ opacity: .55; cursor: default; }

  .options{
    display:flex; align-items:center; gap: 8px;
    margin-top: 14px; position: relative; z-index:1;
  }
  .options label{
    display:flex; align-items:center; gap: 7px;
    font-size: 13px; color: var(--ink-dim); cursor: pointer; user-select:none;
  }
  .options input[type="checkbox"]{ accent-color: var(--accent); width:14px; height:14px; }

  .examples{ margin-top: 14px; position: relative; z-index: 1; }
  .examples-label{ font-size: 12px; color: #4b5b6c; margin-bottom: 8px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em;}
  .chip-row{ display:flex; flex-wrap: wrap; gap: 8px; }
  .chip{
    font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
    background: #0a0f14; border: 1px solid var(--panel-border);
    padding: 6px 10px; border-radius: 999px; cursor: pointer;
  }
  .chip:hover{ border-color: #3a4c5c; color: var(--ink); }

  #result{ margin-top: 26px; }
  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 22px;
    animation: rise .25s ease;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  .verdict-row{ display:flex; align-items:center; justify-content: space-between; gap: 12px; margin-bottom: 16px;}
  .verdict{
    font-family: var(--mono); font-weight: 600; font-size: 15px;
    display:flex; align-items:center; gap: 9px;
  }
  .dot{ width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .verdict.safe{ color: var(--safe); }
  .verdict.suspicious{ color: var(--suspicious); }
  .verdict.scam{ color: var(--scam); }

  .score-pill{
    font-family: var(--mono); font-size: 13px; color: var(--ink-dim);
    background: #0a0f14; border: 1px solid var(--panel-border);
    padding: 4px 10px; border-radius: 999px;
  }

  .gauge{ height: 6px; border-radius: 999px; background: #0a0f14; overflow:hidden; margin-bottom: 18px; border: 1px solid var(--panel-border); }
  .gauge-fill{ height: 100%; border-radius: 999px; transition: width .5s ease; }
  .gauge-fill.safe{ background: var(--safe); }
  .gauge-fill.suspicious{ background: var(--suspicious); }
  .gauge-fill.scam{ background: var(--scam); }

  .signals-label{ font-size: 12px; color: #4b5b6c; text-transform: uppercase; letter-spacing: .05em; font-family: var(--mono); margin-bottom: 10px;}
  ul.signals{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap: 8px; }
  ul.signals li{
    font-size: 13.5px; color: var(--ink); display:flex; gap: 9px; align-items:flex-start; line-height: 1.5;
  }
  ul.signals li::before{ content:"—"; color: var(--ink-dim); flex-shrink:0; }
  .no-signals{ font-size: 13.5px; color: var(--ink-dim); }

  .enrich{ margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--panel-border); }
  .enrich-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
  .enrich-item{ font-family: var(--mono); font-size: 12.5px; }
  .enrich-item .k{ color: #4b5b6c; display:block; margin-bottom: 2px; }
  .enrich-item .v{ color: var(--ink); }

  .error{
    margin-top: 26px; background: rgba(240,85,74,0.08); border: 1px solid rgba(240,85,74,0.3);
    color: #ffb4ae; border-radius: 12px; padding: 14px 16px; font-size: 13.5px; font-family: var(--mono);
  }

  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">//</div>
      <div class="brand-name">Linecheck</div>
    </div>
    <div class="topbar-meta">URL Risk Scanner</div>
  </div>

  <p class="intro">This tool checks a URL's domain, TLD, and structure for common phishing patterns, including typosquatting, so you can spot a scam link before you click it.</p>

  <div class="scanner">
    <div class="panel-label">Scan a URL</div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="e.g. http://paypa1-secure-login.tk/verify" autocomplete="off" spellcheck="false" />
      <button id="scanBtn">Scan</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="enrichToggle" /> also run live SSL / domain-age checks</label>
    </div>
    <div class="examples">
      <div class="examples-label">Try one</div>
      <div class="chip-row">
        <span class="chip" data-url="http://paypa1-secure-login.tk/verify/account?id=39dka">paypa1-secure-login.tk</span>
        <span class="chip" data-url="https://www.github.com/anthropics">github.com</span>
        <span class="chip" data-url="http://192.168.14.22/wp-admin/update.php">raw IP host</span>
        <span class="chip" data-url="https://appleid-verify-account.top/signin">appleid-verify-account.top</span>
      </div>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
const urlInput = document.getElementById('urlInput');
const scanBtn = document.getElementById('scanBtn');
const enrichToggle = document.getElementById('enrichToggle');
const resultEl = document.getElementById('result');

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    urlInput.value = chip.dataset.url;
    runScan();
  });
});

urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') runScan(); });
scanBtn.addEventListener('click', runScan);

function verdictClass(v){
  if (v === 'likely_scam') return 'scam';
  if (v === 'suspicious') return 'suspicious';
  return 'safe';
}
function verdictLabel(v){
  if (v === 'likely_scam') return 'LIKELY SCAM';
  if (v === 'suspicious') return 'SUSPICIOUS';
  return 'LIKELY SAFE';
}

async function runScan(){
  const url = urlInput.value.trim();
  if (!url){ urlInput.focus(); return; }

  scanBtn.disabled = true;
  scanBtn.textContent = 'Scanning…';
  resultEl.innerHTML = '';

  try{
    const res = await fetch('/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, use_enrichment: enrichToggle.checked })
    });
    if (!res.ok){
      const text = await res.text();
      throw new Error(`Server returned ${res.status}: ${text}`);
    }
    const data = await res.json();
    render(data);
  }catch(err){
    resultEl.innerHTML = `<div class="error">Scan failed: ${err.message}</div>`;
  }finally{
    scanBtn.disabled = false;
    scanBtn.textContent = 'Scan';
  }
}

function render(data){
  const vc = verdictClass(data.verdict);
  const pct = Math.round(data.lexical_score * 100);

  let signalsHtml = '<div class="no-signals">No notable red flags in the URL structure.</div>';
  if (data.allowlisted){
    signalsHtml = '<div class="no-signals">Recognized as a well-known, trusted domain.</div>';
  } else if (data.top_signals && data.top_signals.length){
    signalsHtml = '<ul class="signals">' + data.top_signals.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul>';
  }

  let enrichHtml = '';
  if (data.enrichment){
    const e = data.enrichment;
    const sslText = e.ssl ? (e.ssl.expired ? 'expired' : 'valid') : 'unavailable';
    const ageText = (e.domain_age_days === null || e.domain_age_days === undefined) ? 'unavailable' : `${e.domain_age_days} days`;
    const sbText = e.flagged_by_safe_browsing === null ? 'not checked' : (e.flagged_by_safe_browsing ? 'flagged' : 'clean');
    enrichHtml = `
      <div class="enrich">
        <div class="signals-label">Live checks</div>
        <div class="enrich-grid">
          <div class="enrich-item"><span class="k">SSL certificate</span><span class="v">${sslText}</span></div>
          <div class="enrich-item"><span class="k">Domain age</span><span class="v">${ageText}</span></div>
          <div class="enrich-item"><span class="k">Safe Browsing</span><span class="v">${sbText}</span></div>
        </div>
      </div>`;
  }

  resultEl.innerHTML = `
    <div class="card">
      <div class="verdict-row">
        <div class="verdict ${vc}"><span class="dot"></span>${verdictLabel(data.verdict)}</div>
        <div class="score-pill">score ${pct}/100</div>
      </div>
      <div class="gauge"><div class="gauge-fill ${vc}" style="width:${pct}%"></div></div>
      <div class="signals-label">Why</div>
      ${signalsHtml}
      ${enrichHtml}
    </div>
  `;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
